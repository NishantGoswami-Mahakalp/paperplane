name: paperplane

services:
  web:
    image: ghcr.io/nishantgoswami-mahakalp/paperplane-web:latest
    restart: always
    networks:
      default:
        aliases:
          - vps-web-1

  admin:
    image: ghcr.io/nishantgoswami-mahakalp/paperplane-admin:latest
    restart: always
    networks:
      default:
        aliases:
          - vps-admin-1

  space:
    image: ghcr.io/nishantgoswami-mahakalp/paperplane-space:latest
    restart: always
    networks:
      default:
        aliases:
          - vps-space-1

  api:
    image: ghcr.io/nishantgoswami-mahakalp/paperplane-api:latest
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
    networks:
      default:
        aliases:
          - vps-api-1

  worker:
    image: ghcr.io/nishantgoswami-mahakalp/paperplane-api:latest
    restart: always

  beat-worker:
    image: ghcr.io/nishantgoswami-mahakalp/paperplane-api:latest
    restart: always

  migrator:
    image: ghcr.io/nishantgoswami-mahakalp/paperplane-api:latest
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db

  live:
    image: ghcr.io/nishantgoswami-mahakalp/paperplane-live:latest
    restart: always
    networks:
      default:
        aliases:
          - vps-live-1

  plane-db:
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    networks:
      default:
        aliases:
          - vps-plane-minio-1

volumes:
  pgdata:
    name: vps_pgdata
  redisdata:
    name: vps_redisdata
  uploads:
    name: vps_uploads
  rabbitmq_data:
    name: vps_rabbitmq_data

networks:
  default:
    name: vps_default
