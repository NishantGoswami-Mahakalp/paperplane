name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
      - preview
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=${{ github.event.inputs.tag }},enable={{github.event.inputs.tag != ''}}
            type=raw,value=latest,enable={{github.ref == 'refs/heads/main'}}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}-api
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}-web
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin/Dockerfile.admin
          push: true
          tags: ${{ steps.meta.outputs.tags }}-admin
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Space
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/space/Dockerfile.space
          push: true
          tags: ${{ steps.meta.outputs.tags }}-space
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Live
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/live/Dockerfile.live
          push: true
          tags: ${{ steps.meta.outputs.tags }}-live
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./apps/proxy
          file: ./apps/proxy/Dockerfile.ce
          push: true
          tags: ${{ steps.meta.outputs.tags }}-proxy
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AIO
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployments/aio/community/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}-aio
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TAG=${{ github.event.inputs.tag || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.meta.outputs.tags }}-api" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.meta.outputs.tags }}-web" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.meta.outputs.tags }}-admin" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.meta.outputs.tags }}-space" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.meta.outputs.tags }}-live" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.meta.outputs.tags }}-proxy" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.meta.outputs.tags }}-aio" >> $GITHUB_STEP_SUMMARY
