name: Build and Deploy to VPS

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin/Dockerfile.admin
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Space
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/space/Dockerfile.space
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}-space:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Live
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/live/Dockerfile.live
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}-live:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./apps/proxy
          file: ./apps/proxy/Dockerfile.ce
          push: true
          tags: ghcr.io/${{ github.repository.toLowerCase() }}-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/vps
          sparse-checkout-cone-mode: false

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            
            echo "Cloning deployment files..."
            mkdir -p ~/plane-deploy
            cd ~/plane-deploy
            
            # Clone the repo to get docker-compose.yml
            if [ -d .git ]; then
              git pull
            else
              git clone https://github.com/NishantGoswami-Mahakalp/paperplane.git .
              git checkout preview
            fi
            
            cd deploy/vps
            
            # Env files already exist in repo with placeholders
            # User should edit them on VPS after first deploy
            
            echo "Stopping existing containers..."
            docker compose down || true
            
            echo "Pulling new images..."
            docker compose pull
            docker compose up -d
            
            echo "Cleaning up old images..."
            docker image prune -f
            
            echo "Deployment complete!"
            docker compose ps
          EOF

      - name: Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
