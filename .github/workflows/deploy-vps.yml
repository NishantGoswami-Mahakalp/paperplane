name: Deploy to VPS

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/vps
          sparse-checkout-cone-mode: false

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            
            echo "Cloning deployment files..."
            mkdir -p ~/plane-deploy
            cd ~/plane-deploy
            
            # Clone the repo to get docker-compose.yml
            if [ -d .git ]; then
              git pull
            else
              git clone https://github.com/NishantGoswami-Mahakalp/paperplane.git .
              git checkout preview
            fi
            
            cd deploy/vps
            
            # Env files already exist in repo with placeholders
            # User should edit them on VPS after first deploy
            
            echo "Stopping existing containers..."
            docker compose down || true
            
            echo "Pulling new images..."
            docker compose pull
            docker compose up -d
            
            echo "Cleaning up old images..."
            docker image prune -f
            
            echo "Deployment complete!"
            docker compose ps
          EOF

      - name: Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
