name: Build and Deploy to VPS

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - preview
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build and only deploy'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-and-push:
    if: ${{ github.event.inputs.skip_build != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - image: web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - image: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - image: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - image: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: build-and-push
    if: ${{ always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/vps
          sparse-checkout-cone-mode: false

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            
            echo "Cloning deployment files..."
            mkdir -p ~/plane-deploy
            cd ~/plane-deploy
            
            # Clone the repo to get docker-compose.yml
            if [ -d .git ]; then
              git fetch origin preview
              git checkout preview
              # Ensure deployment checkout is always clean and matches remote branch
              # (keeps untracked files like .env, but discards tracked local edits)
              git reset --hard origin/preview
            else
              git clone --branch preview --single-branch https://github.com/NishantGoswami-Mahakalp/paperplane.git .
            fi
            
            cd deploy/vps
            
            # Create env files from templates (they're gitignored)
            if [ ! -f .env ]; then
              echo "POSTGRES_USER=plane" > .env
              echo "POSTGRES_PASSWORD=plane" >> .env
              echo "POSTGRES_DB=plane" >> .env
              echo "RABBITMQ_USER=plane" >> .env
              echo "RABBITMQ_PASSWORD=plane" >> .env
              echo "RABBITMQ_VHOST=plane" >> .env
              echo "LISTEN_HTTP_PORT=80" >> .env
              echo "LISTEN_HTTPS_PORT=443" >> .env
              echo "AWS_ACCESS_KEY_ID=access-key" >> .env
              echo "AWS_SECRET_ACCESS_KEY=secret-key" >> .env
              echo "USE_MINIO=1" >> .env
            fi

            set -a
            source .env
            set +a
            
            mkdir -p apps/api
            if [ ! -f apps/api/.env ]; then
              echo "DEBUG=0" > apps/api/.env
              echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> apps/api/.env
              echo "POSTGRES_USER=plane" >> apps/api/.env
              echo "POSTGRES_PASSWORD=plane" >> apps/api/.env
              echo "POSTGRES_HOST=plane-db" >> apps/api/.env
              echo "POSTGRES_DB=plane" >> apps/api/.env
              echo "DATABASE_URL=postgresql://plane:plane@plane-db:5432/plane" >> apps/api/.env
              echo "REDIS_HOST=plane-redis" >> apps/api/.env
              echo "REDIS_URL=redis://plane-redis:6379/" >> apps/api/.env
              echo "RABBITMQ_HOST=plane-mq" >> apps/api/.env
              echo "RABBITMQ_USER=plane" >> apps/api/.env
              echo "RABBITMQ_PASSWORD=plane" >> apps/api/.env
              echo "RABBITMQ_VHOST=plane" >> apps/api/.env
              echo "AWS_ACCESS_KEY_ID=access-key" >> apps/api/.env
              echo "AWS_SECRET_ACCESS_KEY=secret-key" >> apps/api/.env
              echo "USE_MINIO=1" >> apps/api/.env
              echo "WEB_URL=http://localhost" >> apps/api/.env
              echo "LIVE_SERVER_SECRET_KEY=secret-key" >> apps/api/.env
              echo "API_KEY_RATE_LIMIT=60/minute" >> apps/api/.env
            fi

            mkdir -p apps/live
            if [ ! -f apps/live/.env ]; then
              echo "PORT=3100" > apps/live/.env
              echo "API_BASE_URL=http://api:8000" >> apps/live/.env
              echo "WEB_BASE_URL=http://web:3000" >> apps/live/.env
              echo "LIVE_BASE_URL=http://live:3100" >> apps/live/.env
              echo "LIVE_BASE_PATH=/live" >> apps/live/.env
              echo "LIVE_SERVER_SECRET_KEY=secret-key" >> apps/live/.env
              echo "REDIS_HOST=plane-redis" >> apps/live/.env
              echo "REDIS_PORT=6379" >> apps/live/.env
              echo "REDIS_URL=redis://plane-redis:6379/" >> apps/live/.env
            fi
            
            echo "Stopping existing containers..."
            docker compose -p paperplane down --remove-orphans || true

            # Legacy cleanup: old project name used by previous workflow versions
            docker compose -p vps down --remove-orphans || true
            
            echo "Pulling new images..."
            docker compose -p paperplane pull
            docker compose -p paperplane up -d
            
            # Wait for containers to start
            sleep 10
            
            echo "Cleaning up old images..."
            docker image prune -f
            
            echo "Deployment complete!"
            docker compose -p paperplane ps
          EOF

      - name: Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
