name: Build and Deploy to VPS

on:
  push:
    branches:
      - preview
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build and only deploy'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-and-push:
    if: ${{ github.event.inputs.skip_build != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin/Dockerfile.admin
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Space
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/space/Dockerfile.space
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-space:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Live
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/live/Dockerfile.live
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-live:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./apps/proxy
          file: ./apps/proxy/Dockerfile.ce
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/vps
          sparse-checkout-cone-mode: false

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            
            echo "Cloning deployment files..."
            mkdir -p ~/plane-deploy
            cd ~/plane-deploy
            
            # Clone the repo to get docker-compose.yml
            if [ -d .git ]; then
              git pull
            else
              git clone https://github.com/NishantGoswami-Mahakalp/paperplane.git .
              git checkout preview
            fi
            
            cd deploy/vps
            
            # Stop only plane containers (not other apps on server)
            docker ps -q --filter "name=plane-" | xargs -r docker stop 2>/dev/null || true
            docker ps -aq --filter "name=plane-" | xargs -r docker rm -f 2>/dev/null || true
            
            # Create env files from templates (they're gitignored)
            if [ ! -f .env ]; then
              echo "POSTGRES_USER=plane" > .env
              echo "POSTGRES_PASSWORD=plane" >> .env
              echo "POSTGRES_DB=plane" >> .env
              echo "RABBITMQ_USER=plane" >> .env
              echo "RABBITMQ_PASSWORD=plane" >> .env
              echo "RABBITMQ_VHOST=plane" >> .env
              echo "LISTEN_HTTP_PORT=80" >> .env
              echo "LISTEN_HTTPS_PORT=443" >> .env
              echo "AWS_ACCESS_KEY_ID=access-key" >> .env
              echo "AWS_SECRET_ACCESS_KEY=secret-key" >> .env
              echo "USE_MINIO=1" >> .env
            fi
            
            mkdir -p apps/api
            if [ ! -f apps/api/.env ]; then
              echo "DEBUG=0" > apps/api/.env
              echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> apps/api/.env
              echo "POSTGRES_USER=plane" >> apps/api/.env
              echo "POSTGRES_PASSWORD=plane" >> apps/api/.env
              echo "POSTGRES_HOST=plane-db" >> apps/api/.env
              echo "POSTGRES_DB=plane" >> apps/api/.env
              echo "DATABASE_URL=postgresql://plane:plane@plane-db:5432/plane" >> apps/api/.env
              echo "REDIS_HOST=plane-redis" >> apps/api/.env
              echo "REDIS_URL=redis://plane-redis:6379/" >> apps/api/.env
              echo "RABBITMQ_HOST=plane-mq" >> apps/api/.env
              echo "RABBITMQ_USER=plane" >> apps/api/.env
              echo "RABBITMQ_PASSWORD=plane" >> apps/api/.env
              echo "RABBITMQ_VHOST=plane" >> apps/api/.env
              echo "AWS_ACCESS_KEY_ID=access-key" >> apps/api/.env
              echo "AWS_SECRET_ACCESS_KEY=secret-key" >> apps/api/.env
              echo "USE_MINIO=1" >> apps/api/.env
              echo "WEB_URL=http://localhost" >> apps/api/.env
              echo "LIVE_SERVER_SECRET_KEY=secret-key" >> apps/api/.env
              echo "API_KEY_RATE_LIMIT=60/minute" >> apps/api/.env
            fi
            
            echo "Stopping existing containers..."
            docker compose down || true
            
            echo "Pulling new images..."
            docker compose pull
            docker compose up -d
            
            echo "Cleaning up old images..."
            docker image prune -f
            
            echo "Deployment complete!"
            docker compose ps
          EOF

      - name: Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
