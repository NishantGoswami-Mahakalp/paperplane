name: Build and Deploy to VPS

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin/Dockerfile.admin
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Space
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/space/Dockerfile.space
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-space:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Live
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/live/Dockerfile.live
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-live:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./apps/proxy
          file: ./apps/proxy/Dockerfile.ce
          push: true
          tags: ghcr.io/nishantgoswami-mahakalp/paperplane-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/vps
          sparse-checkout-cone-mode: false

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            
            echo "Cloning deployment files..."
            mkdir -p ~/plane-deploy
            cd ~/plane-deploy
            
            # Clone the repo to get docker-compose.yml
            if [ -d .git ]; then
              git pull
            else
              git clone https://github.com/NishantGoswami-Mahakalp/paperplane.git .
              git checkout preview
            fi
            
            cd deploy/vps
            
            # Create env files from templates (they're gitignored)
            if [ ! -f .env ]; then
              cat > .env << 'ENVEOF'
POSTGRES_USER=plane
POSTGRES_PASSWORD=plane
POSTGRES_DB=plane
RABBITMQ_USER=plane
RABBITMQ_PASSWORD=plane
RABBITMQ_VHOST=plane
LISTEN_HTTP_PORT=80
LISTEN_HTTPS_PORT=443
AWS_ACCESS_KEY_ID=access-key
AWS_SECRET_ACCESS_KEY=secret-key
USE_MINIO=1
ENVEOF
            fi
            
            mkdir -p apps/api
            if [ ! -f apps/api/.env ]; then
              cat > apps/api/.env << 'APIENVEOF'
DEBUG=0
CORS_ALLOWED_ORIGINS=http://localhost:3000
POSTGRES_USER=plane
POSTGRES_PASSWORD=plane
POSTGRES_HOST=plane-db
POSTGRES_DB=plane
DATABASE_URL=postgresql://plane:plane@plane-db:5432/plane
REDIS_HOST=plane-redis
REDIS_URL=redis://plane-redis:6379/
RABBITMQ_HOST=plane-mq
RABBITMQ_USER=plane
RABBITMQ_PASSWORD=plane
RABBITMQ_VHOST=plane
AWS_ACCESS_KEY_ID=access-key
AWS_SECRET_ACCESS_KEY=secret-key
USE_MINIO=1
WEB_URL=http://localhost
LIVE_SERVER_SECRET_KEY=secret-key
API_KEY_RATE_LIMIT=60/minute
APIENVEOF
            fi
            
            echo "Stopping existing containers..."
            docker compose down || true
            
            echo "Pulling new images..."
            docker compose pull
            docker compose up -d
            
            echo "Cleaning up old images..."
            docker image prune -f
            
            echo "Deployment complete!"
            docker compose ps
          EOF

      - name: Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
